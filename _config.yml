title: Levi Blackstone
tagline: Principal Software Engineer
description: Principal software engineer focused on cloud platforms, Kubernetes, Infrastructure-as-Code, and governance.
url: https://leviblackstone.com
author: Levi Blackstone

github_username: lblackstone
linkedin_url: https://www.linkedin.com/in/levi-blackstone

permalink: /writing/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/card.jpg
  - scope:
      type: posts
    values:
      layout: post

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: writing/feed.xml

exclude:
  - README.md
